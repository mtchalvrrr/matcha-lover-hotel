spring.application.name=hotel-reservation-system
server.port=8080

spring.datasource.url=${HOTEL_DB_URL:jdbc:sqlite:./data/hotel-reservation-system.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=32MB

spring.thymeleaf.cache=false
spring.web.resources.cache.cachecontrol.no-store=true

hotel.name=[HOTEL NAME]
hotel.logo=[HOTEL LOGO]
hotel.address=[HOTEL ADDRESS]
hotel.contact=[HOTEL CONTACT INFORMATION]
hotel.time-zone=Asia/Manila
hotel.storage.location=${HOTEL_STORAGE_LOCATION:./data/uploads}

# Configure mail credentials through environment variables; never commit secrets.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# External payment and AI integrations remain disabled until credentials are configured.
payment.mode=${PAYMENT_MODE:SIMULATED}
ai.enabled=${AI_ENABLED:false}
