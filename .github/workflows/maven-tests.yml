name: Maven tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: hotel-clean-repo/pom.xml

      - name: Run Maven tests
        working-directory: hotel-clean-repo
        run: mvn --batch-mode --no-transfer-progress clean test
