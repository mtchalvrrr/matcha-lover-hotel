name: Build and test
on:
  push:
    branches: [new-hotel-system, 'spec-alignment/complete-system-cycle', 'feature/complete-extension-and-role-gaps']
  pull_request:
    branches: [main, new-hotel-system]
    paths:
      - 'pom.xml'
      - 'src/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Maven project
        run: mvn --batch-mode --no-transfer-progress clean verify
