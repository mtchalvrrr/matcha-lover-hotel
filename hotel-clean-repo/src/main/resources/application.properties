spring.application.name=mtchlvr-hotel
# Optional, untracked local overrides when Codespaces secrets are unavailable.
spring.config.import=optional:file:./local-secrets.properties
server.port=8080
# Honor forwarded host and protocol headers when deployed behind a trusted reverse proxy (e.g. Codespaces).
server.forward-headers-strategy=framework
spring.datasource.url=jdbc:sqlite:./data/mtchlvr.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB


# Google reCAPTCHA v2 checkbox keys (configure environment variables before running)
google.recaptcha.site-key=${RECAPTCHA_SITE_KEY:}
google.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}

# Registration and account provisioning password policy.
registration.password.min-length=${REGISTRATION_PASSWORD_MIN_LENGTH:10}
registration.password.max-length=${REGISTRATION_PASSWORD_MAX_LENGTH:70}
registration.password.require-lowercase=${REGISTRATION_PASSWORD_REQUIRE_LOWERCASE:true}
registration.password.require-uppercase=${REGISTRATION_PASSWORD_REQUIRE_UPPERCASE:true}
registration.password.require-number=${REGISTRATION_PASSWORD_REQUIRE_NUMBER:true}
registration.password.require-special=${REGISTRATION_PASSWORD_REQUIRE_SPECIAL:true}
registration.password.allowed-specials=${REGISTRATION_PASSWORD_ALLOWED_SPECIALS:!@#$%^&*()-_+[]:;,.?}

# Optional one-time bootstrap accounts. Leave blank unless setting up a fresh database.
hotel.initial-super-admin.email=${INITIAL_SUPER_ADMIN_EMAIL:}
hotel.initial-super-admin.password=${INITIAL_SUPER_ADMIN_PASSWORD:}
hotel.initial-super-admin.name=${INITIAL_SUPER_ADMIN_NAME:Super Admin}
hotel.initial-manager.email=${INITIAL_MANAGER_EMAIL:}
hotel.initial-manager.password=${INITIAL_MANAGER_PASSWORD:}
hotel.initial-manager.name=${INITIAL_MANAGER_NAME:Hotel Manager}
hotel.initial-manager.role=${INITIAL_MANAGER_ROLE:MANAGER}

# Groq AI chatbot
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=openai/gpt-oss-120b

# Gmail SMTP credentials are supplied only through Codespaces environment secrets.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:${GMAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${GMAIL_APP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Private identity uploads are stored outside the public static directory.
va.hotel.identity-upload-dir=${VA_IDENTITY_UPLOAD_DIR:./private-uploads/identity}
va.hotel.room-photo-dir=${VA_ROOM_PHOTO_DIR:./uploads/rooms}
