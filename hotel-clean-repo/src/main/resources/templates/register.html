<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · mtchlvr hotel</title><link rel="stylesheet" href="/css/style.css"><style>.registration-step[hidden]{display:none}.registration-progress{display:grid;gap:8px;margin:4px 0 18px;color:#304a2d}.registration-progress-current{font-size:10px;font-weight:800;letter-spacing:.12em;color:#397c38}.registration-progress strong{font-size:18px}.registration-progress-track{height:5px;border-radius:9px;background:#e5ebdf;overflow:hidden}.registration-progress-track span{display:block;height:100%;background:#397c38;border-radius:9px}.registration-step-actions{display:flex;justify-content:space-between;gap:10px}.registration-step-actions .button{flex:1}</style></head><body class="auth-body"><a class="brand auth-brand" href="/"><span class="brand-mark">m</span><span>mtchlvr <small>HOTEL</small></span></a><main class="auth-card"><span class="eyebrow">MAKE YOURSELF AT HOME</span><h1>Your stay starts <em>here.</em></h1><p class="muted">Create your account to plan your stay.</p><form th:action="@{/register}" th:object="${form}" method="post" class="stack-form" autocomplete="off"><div th:if="${#fields.hasErrors('*')}" class="alert error">Please review the highlighted details and try again.</div><div class="registration-step" data-registration-step="1"><div class="registration-progress"><span class="registration-progress-current">STEP 1 OF 2</span><div class="registration-progress-track"><span style="width:50%"></span></div><strong>About you</strong></div><label>First name<input th:field="*{firstName}" required minlength="1" maxlength="60" placeholder="First name" autocomplete="given-name"><small th:errors="*{firstName}"></small></label><label>Last name<input th:field="*{lastName}" required minlength="1" maxlength="60" placeholder="Last name" autocomplete="family-name"><small th:errors="*{lastName}"></small></label><label>Email address<input type="email" th:field="*{email}" required maxlength="160" placeholder="you@example.com" autocomplete="email"><small th:errors="*{email}"></small></label><button class="button wide" type="button" data-registration-next>Continue to security ↗</button></div><div class="registration-step" data-registration-step="2" hidden><div class="registration-progress"><span class="registration-progress-current">STEP 2 OF 2</span><div class="registration-progress-track"><span style="width:100%"></span></div><strong>Secure your account</strong></div><label>Password<div class="password-field"><input id="registerPassword" type="password" th:field="*{password}" required minlength="10" maxlength="72" placeholder="Create a strong password" autocomplete="new-password"><button type="button" class="password-toggle" data-password-toggle="registerPassword" aria-label="Show password" aria-pressed="false">Show</button></div><small th:errors="*{password}"></small><ul class="password-rules" id="passwordRules" aria-live="polite"><li data-rule="length" class="rule-pending">10+ characters</li><li data-rule="upper" class="rule-pending">Uppercase letter</li><li data-rule="lower" class="rule-pending">Lowercase letter</li><li data-rule="number" class="rule-pending">Number</li><li data-rule="symbol" class="rule-pending">Special symbol</li><li data-rule="nospace" class="rule-pending">No spaces</li></ul><div class="password-strength" aria-hidden="true"><span class="password-strength-bar" id="passwordStrengthBar"></span><small class="password-strength-label" id="passwordStrengthLabel">Enter a password</small></div></label><label>Confirm password<div class="password-field"><input id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Re-enter your password" required autocomplete="new-password"><button type="button" class="password-toggle" data-password-toggle="confirmPassword" aria-label="Show confirm password" aria-pressed="false">Show</button></div><small class="muted" id="confirmMatchHint" aria-live="polite"></small><small th:errors="*{confirmPassword}"></small></label><div class="captcha-wrap"><div class="g-recaptcha" th:attr="data-sitekey=${@environment.getProperty('google.recaptcha.site-key', '')}"></div><small th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></small></div><div class="registration-step-actions"><button class="button secondary" type="button" data-registration-back>← Back</button><button class="button" type="submit">Create account ↗</button></div></div></form><p class="auth-switch">Already a guest? <a href="/login">Sign in</a></p></main><script src="https://www.google.com/recaptcha/api.js" async defer></script><script src="/js/app.js"></script><div th:replace="~{fragments :: chatbot}"></div>
<script>
(() => {
  const form = document.querySelector("form.stack-form");
  if (!form) return;

  function clearRegistrationForm() {
    form.querySelectorAll("input").forEach((input) => {
      if (!["hidden", "submit", "button", "reset"].includes(input.type)) {
        input.value = "";
        if (input.type === "checkbox" || input.type === "radio") {
          input.checked = false;
        }
      }
    });

    const captchaToken = form.querySelector('[name="g-recaptcha-response"]');
    if (captchaToken) captchaToken.value = "";

    if (window.grecaptcha && typeof window.grecaptcha.reset === "function") {
      try { window.grecaptcha.reset(); } catch (_) {}
    }
  }

  // Real-time password validation
  const pwd = document.getElementById("registerPassword");
  const confirm = document.getElementById("confirmPassword");
  const rulesList = document.getElementById("passwordRules");
  const strengthBar = document.getElementById("passwordStrengthBar");
  const strengthLabel = document.getElementById("passwordStrengthLabel");
  const confirmHint = document.getElementById("confirmMatchHint");

  const ruleChecks = {
    length: (v) => v.length >= 10,
    upper: (v) => /[A-Z]/.test(v),
    lower: (v) => /[a-z]/.test(v),
    number: (v) => /\d/.test(v),
    symbol: (v) => /[^A-Za-z0-9]/.test(v),
    nospace: (v) => v.length === 0 || !/\s/.test(v),
  };

  function scorePassword(v) {
    let score = 0;
    if (v.length >= 10) score++;
    if (v.length >= 14) score++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
    if (/\d/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    if (v.length >= 18) score++;
    return Math.min(score, 4);
  }

  const strengthLabels = ["Too weak", "Weak", "Fair", "Strong", "Excellent"];
  const strengthClasses = ["strength-0", "strength-1", "strength-2", "strength-3", "strength-4"];

  function updateRules() {
    if (!pwd || !rulesList) return;
    const v = pwd.value;
    let allPass = true;
    rulesList.querySelectorAll("[data-rule]").forEach((li) => {
      const key = li.dataset.rule;
      const ok = ruleChecks[key] ? ruleChecks[key](v) : false;
      li.classList.toggle("rule-ok", ok);
      li.classList.toggle("rule-pending", !ok && v.length === 0);
      li.classList.toggle("rule-bad", !ok && v.length > 0);
      if (!ok) allPass = false;
    });
    if (strengthBar && strengthLabel) {
      const s = v.length === 0 ? 0 : scorePassword(v);
      strengthBar.className = "password-strength-bar " + strengthClasses[s];
      strengthLabel.textContent = v.length === 0 ? "Enter a password" : strengthLabels[s];
    }
    return allPass;
  }

  function updateConfirm() {
    if (!confirm || !confirmHint) return;
    if (confirm.value.length === 0) {
      confirmHint.textContent = "";
      confirmHint.style.color = "";
      confirm.setCustomValidity("");
      return;
    }
    if (confirm.value === pwd.value) {
      confirmHint.textContent = "Passwords match.";
      confirmHint.style.color = "#2a7c13";
      confirm.setCustomValidity("");
    } else {
      confirmHint.textContent = "Passwords do not match yet.";
      confirmHint.style.color = "#9a3e25";
      confirm.setCustomValidity("Passwords do not match.");
    }
  }

  if (pwd) {
    pwd.addEventListener("input", () => { updateRules(); updateConfirm(); });
  }
  if (confirm) {
    confirm.addEventListener("input", updateConfirm);
  }
  updateRules();

  const steps = Array.from(form.querySelectorAll("[data-registration-step]"));
  const showStep = (number) => {
    steps.forEach((step) => { step.hidden = step.dataset.registrationStep !== String(number); });
    const active = steps.find((step) => step.dataset.registrationStep === String(number));
    active?.querySelector("input")?.focus({ preventScroll: true });
  };
  form.querySelector("[data-registration-next]")?.addEventListener("click", () => {
    const firstStep = steps.find((step) => step.dataset.registrationStep === "1");
    const invalid = Array.from(firstStep.querySelectorAll("input")).find((input) => !input.checkValidity());
    if (invalid) { invalid.reportValidity(); return; }
    showStep(2);
  });
  form.querySelector("[data-registration-back]")?.addEventListener("click", () => showStep(1));
  const hasSecurityError = !!form.querySelector(".registration-step[data-registration-step='2'] small:not(:empty)") ||
    !!form.querySelector(".alert.error");
  showStep(hasSecurityError ? 2 : 1);

  window.addEventListener("pageshow", (event) => {
    let navigationType = "";
    try {
      navigationType =
        performance.getEntriesByType("navigation")[0]?.type || "";
    } catch (_) {}

    if (event.persisted || navigationType === "back_forward") {
      clearRegistrationForm();
      window.setTimeout(clearRegistrationForm, 250);
    }
  });
})();
</script>

</body></html>
