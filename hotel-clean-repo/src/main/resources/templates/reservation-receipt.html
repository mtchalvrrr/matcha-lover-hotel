<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservation receipt</title><link rel="stylesheet" href="/css/style.css"><style>.receipt{max-width:760px;margin:36px auto;padding:36px;background:white;border:1px solid #dce7d5;border-radius:16px}.receipt h1{color:#315b3b}.receipt dl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.receipt dt{color:#667568}.receipt dd{margin:0;font-weight:700}.receipt-total{font-size:1.25rem;border-top:1px solid #dce7d5;padding-top:16px}@media print{body{background:white!important}.receipt{margin:0 auto;border:0;box-shadow:none}.no-print{display:none!important}}</style></head><body><main class="receipt"><div class="no-print"><button class="button" onclick="window.print()">Print / Save PDF</button> <a href="/customer/reservations">Back to reservations</a></div><p><strong>MATCHA LOVER HOTEL</strong></p><h1 th:text="${finalReceipt ? 'Final stay receipt' : 'Reservation receipt'}">Reservation receipt</h1><dl><dt>Reservation ID</dt><dd th:text="${reservation.id}"></dd><dt>Guest</dt><dd th:text="${reservation.customer != null ? reservation.customer.fullName : reservation.walkInGuest.fullName}"></dd><dt>Customer code</dt><dd th:text="${reservation.customer != null ? reservation.customer.customerCode : 'Walk-in guest'}"></dd><dt>Room</dt><dd th:text="${reservation.room.roomNumber + ' · ' + reservation.room.type}"></dd><dt>Check-in</dt><dd th:text="${reservation.checkIn + ' ' + (reservation.checkInTime == null ? '14:00' : reservation.checkInTime)}"></dd><dt>Checkout</dt><dd th:text="${reservation.checkOut + ' ' + (reservation.checkOutTime == null ? '12:00' : reservation.checkOutTime)}"></dd><dt>Nights</dt><dd th:text="${reservation.nights}"></dd><dt>Rate per night</dt><dd th:text="'₱' + ${#numbers.formatDecimal(reservation.nightlyRateAtBooking,1,'COMMA',2,'POINT')}"></dd><dt>Status</dt><dd th:text="${reservation.status}"></dd><dt>Reservation date</dt><dd th:text="${reservation.createdAt}"></dd></dl><p class="receipt-total">Total amount: <strong th:text="'₱' + ${#numbers.formatDecimal(reservation.totalCost,1,'COMMA',2,'POINT')}"></strong></p><p>Payments use NexusPay simulation records and do not represent a live bank or card charge.</p></main></body></html>
