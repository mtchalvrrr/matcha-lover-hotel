<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manager accounts · Matcha Lover Hotel</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="page-wrap"><a href="/super-admin">← Super Admin</a><h1 class="page-title">Manager accounts</h1><div th:replace="~{fragments :: alerts}"></div><form method="get" class="filter-row"><input name="q" th:value="${q}" placeholder="Search name or email"><select name="role"><option value="all">All roles</option><option value="MANAGER" th:selected="${selectedRole == 'MANAGER'}">Manager</option><option value="ONLINE_MANAGER" th:selected="${selectedRole == 'ONLINE_MANAGER'}">Online manager</option><option value="ONSITE_MANAGER" th:selected="${selectedRole == 'ONSITE_MANAGER'}">On-site manager</option></select><button class="button">Filter</button><a class="button" href="/super-admin/managers/new">Create manager</a></form><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr></thead><tbody><tr th:each="manager : ${managers}"><td th:text="${manager.fullName}"></td><td th:text="${manager.email}"></td><td th:text="${manager.role}"></td><td><a th:href="@{'/super-admin/managers/' + ${manager.id} + '/edit'}">Edit</a> <form style="display:inline" method="post" th:action="@{'/super-admin/managers/' + ${manager.id} + '/delete'}" data-confirm="Delete this manager account?"><button class="button tiny secondary">Delete</button></form></td></tr></tbody></table></div></main><script src="/js/app.js"></script></body></html>
