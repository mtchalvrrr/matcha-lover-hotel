<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revenue report · Matcha Lover Hotel</title><link rel="stylesheet" href="/css/style.css"><style>.report-card{background:#fff;padding:24px;border-radius:14px;border:1px solid #dce7d5}.chart{display:grid;gap:8px}.bar-row{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:12px}.bar-track{background:#edf2e9;border-radius:99px;overflow:hidden;height:18px}.bar{height:100%;background:#5c8a4d;min-width:2px}.report-note{background:#fff8df;border:1px solid #eadca7;padding:14px;border-radius:10px}@media print{body{background:white!important}.no-print{display:none!important}.report-card{border:0}}</style></head><body><div th:replace="~{fragments :: nav}"></div><main class="page-wrap"><h1 class="page-title">Revenue report</h1><form class="no-print filter-row" method="get"><label>Period<select name="period"><option value="DAILY" th:selected="${period == 'DAILY'}">Daily</option><option value="WEEKLY" th:selected="${period == 'WEEKLY'}">Weekly</option><option value="MONTHLY" th:selected="${period == 'MONTHLY'}">Monthly</option><option value="ANNUAL" th:selected="${period == 'ANNUAL'}">Annual</option></select></label><label>Reference date<input type="date" name="date" th:value="${referenceDate}"></label><button class="button">Show report</button><button class="button secondary" type="button" onclick="window.print()">Print report</button></form><section class="report-card"><h2 th:text="${period + ' · ₱' + #numbers.formatDecimal(report.total,1,'COMMA',2,'POINT')}"></h2><p class="report-note">NexusPay payments are simulations and excluded. Revenue includes only successful non-simulation payments attached to completed reservations. The current system has no live payment gateway.</p><h3>Revenue by date</h3><div class="chart"><div class="bar-row" th:each="bucket : ${report.buckets}"><span th:text="${bucket.label}"></span><div class="bar-track"><div class="bar" th:style="'width:' + ${barWidths[bucket.label]} + '%'"></div></div><strong th:text="'₱' + ${#numbers.formatDecimal(bucket.amount,1,'COMMA',2,'POINT')}"></strong></div></div></section></main></body></html>
