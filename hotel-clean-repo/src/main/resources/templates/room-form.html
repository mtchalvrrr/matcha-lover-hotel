<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room details · Matcha Lover Hotel</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="page-wrap"><a href="/manager/room-management">← Room management</a><h1 class="page-title" th:text="${room.id == null ? 'Add room' : 'Edit room'}"></h1><form class="stack-form" method="post" enctype="multipart/form-data" th:object="${room}" th:action="${room.id == null ? '/manager/rooms' : '/manager/rooms/' + room.id}"><label>Room number<input name="roomNumber" th:value="*{roomNumber}" required maxlength="30"></label><label>Room type<input name="type" th:value="*{type}" required maxlength="60"></label><label>Rate per night<input name="nightlyRate" th:value="*{nightlyRate}" type="number" min="0" step="0.01" required></label><label>Capacity<input name="capacity" th:value="*{capacity}" type="number" min="1" max="10" required></label><label>Description<textarea name="description" maxlength="2000" rows="5" th:text="*{description}"></textarea></label><fieldset><legend>Room photos (5 images)</legend><p th:if="${room.id != null}">Select five replacement images to update the current set. Leave all five empty to keep the current photos.</p><label>Photo 1<input type="file" name="photos" accept="image/jpeg,image/png" th:required="${room.id == null}"></label><label>Photo 2<input type="file" name="photos" accept="image/jpeg,image/png" th:required="${room.id == null}"></label><label>Photo 3<input type="file" name="photos" accept="image/jpeg,image/png" th:required="${room.id == null}"></label><label>Photo 4<input type="file" name="photos" accept="image/jpeg,image/png" th:required="${room.id == null}"></label><label>Photo 5<input type="file" name="photos" accept="image/jpeg,image/png" th:required="${room.id == null}"></label><p th:if="${room.photos != null and !room.photos.isEmpty()}">Current photos are saved. Upload exactly five to replace them.</p></fieldset><button class="button">Save room</button></form></main></body></html>
