<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manager account · Matcha Lover Hotel</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="page-wrap"><a href="/super-admin/managers">← Manager accounts</a><h1 class="page-title" th:text="${managerId == null ? 'Create manager' : 'Edit manager'}"></h1><form class="stack-form" method="post" th:object="${manager}" th:action="${managerId == null ? '/super-admin/managers' : '/super-admin/managers/' + managerId}"><label>Full name<input th:field="*{fullName}" required maxlength="120"></label><small th:errors="*{fullName}"></small><label>Email<input th:field="*{email}" type="email" required th:readonly="${managerId != null}"></label><small th:errors="*{email}"></small><label>Role<select th:field="*{role}"><option value="ONLINE_MANAGER">Online Manager</option><option value="ONSITE_MANAGER">On-site Manager</option><option value="MANAGER">Manager</option></select></label><label>Password<input th:field="*{password}" type="password" th:required="${managerId == null}" th:attr="minlength=${passwordPolicy.minimumLength},maxlength=${passwordPolicy.maximumLength}" autocomplete="new-password"></label><small th:if="${managerId != null}">Leave blank to keep the current password. New passwords must follow the configured policy.</small><small th:errors="*{password}"></small><button class="button">Save manager</button></form></main></body></html>
