<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My profile · Matcha Lover Hotel</title><link rel="stylesheet" href="/css/style.css"></head><body class="customer-body"><div th:replace="~{fragments :: nav}"></div><main class="page-wrap"><div th:replace="~{fragments :: alerts}"></div><a href="/customer/reservations">← Reservations</a><h1 class="page-title">Your profile</h1><form class="stack-form" method="post" action="/customer/profile"><label>Full name<input name="fullName" th:value="${customer.fullName}" maxlength="120" required></label><label>Email<input type="email" th:value="${customer.email}" readonly></label><label>Customer code<input th:value="${customer.customerCode}" readonly></label><h2>Change password</h2><label>Current password<input name="currentPassword" type="password" autocomplete="current-password"></label><label>New password<input name="newPassword" type="password" th:attr="minlength=${passwordPolicy.minimumLength},maxlength=${passwordPolicy.maximumLength}" autocomplete="new-password"></label><button class="button">Save profile</button></form></main></body></html>
