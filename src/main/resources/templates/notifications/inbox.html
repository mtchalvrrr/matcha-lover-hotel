<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notifications | [HOTEL NAME]</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="shell narrow"><header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">H</span><span>[HOTEL NAME]</span></a><a class="back-link" th:href="@{/{portal}/dashboard(portal=${portal})}">Dashboard</a></header>
<section class="portal-hero compact-hero"><p class="eyebrow" th:text="${portal + ' / INBOX'}">INBOX</p><h1>Your<br><em>notifications.</em></h1><p class="intro">Important updates related to your account, reservations, and hotel operations.</p></section>
<p class="alert alert-error" th:if="${error}" th:text="${error}"></p>
<section class="notification-list"><article class="notification-item" th:each="item : ${notifications}" th:classappend="${item.read ? ' is-read' : ''}"><div><p class="eyebrow" th:text="${item.category}">CATEGORY</p><h2 th:text="${item.title}">Notification title</h2><p th:text="${item.message}">Notification details</p><small th:text="${item.createdAt}">Date</small></div><form th:if="${!item.read}" th:action="@{/{portal}/notifications/{id}/read(portal=${portal},id=${item.id})}" method="post"><button class="text-button" type="submit">Mark as read</button></form><span th:if="${item.read}" class="read-label">Read</span></article></section>
<p class="notice" th:if="${#lists.isEmpty(notifications)}">You have no notifications.</p>
</main></body></html>
