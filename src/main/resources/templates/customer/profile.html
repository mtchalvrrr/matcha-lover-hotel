<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Profile | [HOTEL NAME]</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="shell narrow"><header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">H</span><span>[HOTEL NAME]</span></a><a class="back-link" th:href="@{/customer/dashboard}">Customer dashboard</a></header>
<section class="portal-hero compact-hero"><p class="eyebrow">CUSTOMER / ACCOUNT</p><h1>My<br><em>profile.</em></h1><p class="intro">Keep your account information current and manage your password.</p></section>
<p class="notice" th:if="${success}" th:text="${success}"></p><p class="alert alert-error" th:if="${error}" th:text="${error}"></p>
<form class="auth-card wide-form" th:action="@{/customer/profile}" method="post"><h2>Personal information</h2>
<label for="firstName">First name</label><input id="firstName" name="firstName" th:value="${account.firstName}" maxlength="80" required>
<label for="lastName">Last name</label><input id="lastName" name="lastName" th:value="${account.lastName}" maxlength="80" required>
<label for="email">Email address</label><input id="email" name="email" type="email" th:value="${account.email}" maxlength="254" required>
<label>Username</label><input th:value="${account.username}" disabled>
<button class="primary-button" type="submit">Save profile</button></form>
<form class="auth-card wide-form" th:action="@{/customer/profile/password}" method="post"><h2>Change password</h2>
<label for="currentPassword">Current password</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
<label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" minlength="12" autocomplete="new-password" required>
<p class="form-help">At least 12 characters, including uppercase, lowercase, a number, and a special character.</p>
<button class="primary-button" type="submit">Change password</button></form>
</main><div th:replace="~{fragments/chat-widget :: chatWidget}"></div>
</body></html>
