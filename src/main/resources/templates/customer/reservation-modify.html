<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Modify Reservation | [HOTEL NAME]</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<main class="shell narrow">
<div th:replace="~{fragments/customer-header :: customerHeader('dashboard')}"></div>
<section class="portal-hero compact-hero"><p class="eyebrow">CUSTOMER / RESERVATION CHANGE</p><h1>Update your<br><em>stay details.</em></h1><p class="intro">Changes are checked against current availability. If your request was already approved, the updated reservation returns to pending review.</p></section>
<p class="alert alert-error" th:if="${error}" th:text="${error}"></p>
<form class="auth-card wide-form" th:action="@{/customer/reservations/{id}/modify(id=${reservation.id})}" method="post">
<label for="roomId">Room</label>
<select id="roomId" name="roomId" required>
<option th:each="room : ${rooms}" th:value="${room.id}" th:text="${room.roomCode + ' — ' + room.name + ' (₱' + #numbers.formatDecimal(room.nightlyRate,1,'COMMA',2,'POINT') + '/night)'}" th:selected="${room.id == reservation.roomId}">Room</option>
</select>
<label for="checkIn">Check-in date</label><input id="checkIn" type="date" name="checkIn" th:value="${reservation.checkInDate}" th:attr="min=${minimumDate}" required>
<label for="checkOut">Check-out date</label><input id="checkOut" type="date" name="checkOut" th:value="${reservation.checkOutDate}" th:attr="min=${minimumDate}" required>
<label for="guests">Number of guests</label><input id="guests" type="number" name="guests" min="1" th:value="${reservation.guests}" required>
<p class="form-help">A reservation with a recorded payment cannot be modified online. Contact the hotel for assistance.</p>
<button class="primary-button" type="submit">Submit changes for review</button>
</form>
</main>
<div th:replace="~{fragments/chat-widget :: chatWidget}"></div>
</body></html>
