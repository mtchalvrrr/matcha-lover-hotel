<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Track Registration | [HOTEL NAME]</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="shell narrow">
<header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">H</span><span th:text="${hotelSettings.hotelName}">[HOTEL NAME]</span></a><a class="back-link" th:href="@{/customer/login}">Customer sign in</a></header>
<section class="portal-hero compact-hero"><p class="eyebrow">CUSTOMER / REGISTRATION</p><h1>Track your<br><em>application.</em></h1><p class="intro">Enter the application reference shown after registration and the email address used on the application.</p></section>
<p class="alert alert-error" th:if="${error}" th:text="${error}"></p>
<form class="auth-card wide-form" th:action="@{/registration/status}" method="post">
<label for="applicationId">Application reference</label><input id="applicationId" name="applicationId" type="number" min="1" required>
<label for="email">Registered email address</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
<button class="primary-button" type="submit">Check application status</button>
</form>
</main><div th:replace="~{fragments/chat-widget :: chatWidget}"></div>
</body></html>
