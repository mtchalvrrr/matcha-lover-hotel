<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Security Events | Matcha Lover Hotel</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="shell"><header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">H</span><span>Matcha Lover Hotel</span></a><a class="back-link" th:href="@{/super-admin/dashboard}">Super Admin dashboard</a></header>
<section class="portal-hero compact-hero"><p class="eyebrow">SUPER ADMIN / MONITORING</p><h1>Security<br><em>events.</em></h1><p class="intro">Review recorded login successes, failed sign-ins, and temporary account locks.</p></section>
<form class="report-filter" th:action="@{/super-admin/security-events}" method="get"><label for="actor">Actor username</label><input id="actor" name="actor" maxlength="80" th:value="${actor}" placeholder="Filter by username"><label for="from">From</label><input id="from" name="from" type="date" th:value="${from}"><label for="to">To</label><input id="to" name="to" type="date" th:value="${to}"><button class="primary-button" type="submit">Filter</button><a class="secondary-link" th:href="@{/super-admin/security-events}">Clear</a></form>
<div class="table-wrap"><table class="data-table"><thead><tr><th>Timestamp</th><th>Actor</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody><tr th:each="event : ${events}"><td th:text="${event.createdAt}">Date</td><td th:text="${event.actorUsername}">Actor</td><td th:text="${event.action}">ACTION</td><td th:text="${event.targetType + ' / ' + event.targetId}">Target</td><td th:text="${event.details}">Details</td></tr></tbody></table></div><p class="notice" th:if="${#lists.isEmpty(events)}">No matching events were found for this filter.</p>
</main></body></html>
