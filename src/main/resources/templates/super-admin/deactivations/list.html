<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Deactivation Review | [HOTEL NAME]</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<main class="shell">
<header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">H</span><span>[HOTEL NAME]</span></a><a class="back-link" th:href="@{/super-admin/dashboard}">Super Admin dashboard</a></header>
<section class="portal-hero compact-hero"><p class="eyebrow">SUPER ADMIN / ACCOUNT CONTROL</p><h1>Deactivation<br><em>requests.</em></h1><p class="intro">Review customer requests before disabling accounts.</p></section>
<p class="notice" th:if="${success}" th:text="${success}"></p><p class="alert alert-error" th:if="${error}" th:text="${error}"></p>
<div class="table-wrap"><table class="data-table"><thead><tr><th>Customer</th><th>Reason</th><th>Requested</th><th>Review</th></tr></thead><tbody>
<tr th:each="request : ${requests}"><td th:text="${request.username}">customer</td><td th:text="${request.reason}">Reason</td><td th:text="${request.requestedAt}">Date</td><td><div class="review-actions">
<form th:action="@{/super-admin/deactivations/{id}/review(id=${request.id})}" method="post"><input type="hidden" name="approve" value="true"><button class="text-button" type="submit">Approve and deactivate</button></form>
<form th:action="@{/super-admin/deactivations/{id}/review(id=${request.id})}" method="post"><input type="hidden" name="approve" value="false"><input type="text" name="reason" maxlength="1000" placeholder="Reason for rejection" required><button class="text-button" type="submit">Reject request</button></form>
</div></td></tr>
</tbody></table></div>
<p class="notice" th:if="${#lists.isEmpty(requests)}">There are no pending deactivation requests.</p>
</main>
</body></html>
