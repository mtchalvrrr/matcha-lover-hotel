<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Audit Log | [HOTEL NAME]</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="shell"><header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">H</span><span th:text="${hotelSettings.hotelName}">[HOTEL NAME]</span></a><a class="back-link" th:href="@{/super-admin/dashboard}">Super Admin dashboard</a></header>
<section class="portal-hero compact-hero"><p class="eyebrow">SUPER ADMIN / SECURITY</p><h1>Audit<br><em>trail.</em></h1><p class="intro">Recent recorded actions, including the exact administrator username responsible for each reservation decision.</p></section>
<div class="table-wrap"><table class="data-table"><thead><tr><th>Timestamp</th><th>Actor</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody>
<tr th:each="event : ${events}"><td th:text="${event.createdAt}">Date</td><td th:text="${event.actorUsername}">actor</td><td th:text="${event.action}">ACTION</td><td th:text="${event.targetType + ' / ' + event.targetId}">Target</td><td th:text="${event.details}">Details</td></tr>
</tbody></table></div><p class="notice" th:if="${#lists.isEmpty(events)}">No audit events have been recorded yet.</p>
</main></body></html>
