<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Password Recovery | [HOTEL NAME]</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="shell narrow"><header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">H</span><span th:text="${hotelSettings.hotelName}">[HOTEL NAME]</span></a><a class="back-link" th:href="@{/customer/login}">Back to sign in</a></header>
<section class="portal-hero compact-hero"><p class="eyebrow">ACCOUNT SECURITY</p><h1>Reset your<br><em>password.</em></h1><p class="intro">Enter your account email. If it matches an account, we will send a time-limited reset link.</p></section>
<p class="notice" th:if="${success}" th:text="${success}"></p>
<form class="auth-card wide-form" th:action="@{/forgot-password}" method="post"><label for="email">Account email</label><input id="email" name="email" type="email" maxlength="254" required><button class="primary-button" type="submit">Send reset link</button></form>
</main></body></html>
