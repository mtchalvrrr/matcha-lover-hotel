<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Set New Password | [HOTEL NAME]</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="shell narrow"><header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">H</span><span th:text="${hotelSettings.hotelName}">[HOTEL NAME]</span></a><a class="back-link" th:href="@{/customer/login}">Sign in</a></header>
<section class="portal-hero compact-hero"><p class="eyebrow">ACCOUNT SECURITY</p><h1>Choose a new<br><em>password.</em></h1><p class="intro">Reset links expire after 20 minutes and can only be used once.</p></section>
<p class="alert alert-error" th:if="${error}" th:text="${error}"></p>
<form class="auth-card wide-form" th:action="@{/reset-password}" method="post"><input type="hidden" name="token" th:value="${token}"><label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" minlength="12" autocomplete="new-password" required><p class="form-help">At least 12 characters, including uppercase, lowercase, a number, and a special character.</p><button class="primary-button" type="submit">Save new password</button></form>
</main></body></html>
