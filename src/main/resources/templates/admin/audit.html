<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Activity Log | Hotel</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="shell visual-hotel-page">
<header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">H</span><span th:text="${hotelSettings.hotelName}">Hotel</span></a><a class="back-link" th:href="@{/admin/dashboard}">Admin dashboard</a></header>
<section class="portal-hero compact-hero"><p class="eyebrow">ADMIN / OPERATIONS</p><h1>Activity<br><em>log.</em></h1><p class="intro">Review important reservation, payment, and account activity across the hotel.</p></section>
<figure class="visual-photo visual-photo-short"><img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1600&q=85" alt="Contemporary hotel exterior and entrance"><figcaption>Hotel operations · Account activity</figcaption></figure>
<p class="alert alert-error" th:if="${error}" th:text="${error}"></p>
<form class="report-filter visual-filter" th:action="@{/admin/audit}" method="get"><label for="auditActor">Account / actor</label><input id="auditActor" name="actor" type="search" maxlength="80" th:value="${actor}" placeholder="Username"><label for="auditAction">Action</label><input id="auditAction" name="action" type="search" maxlength="80" th:value="${action}" placeholder="Action type"><label for="auditFrom">From</label><input id="auditFrom" name="from" type="date" th:value="${from}"><label for="auditTo">To</label><input id="auditTo" name="to" type="date" th:value="${to}"><button class="primary-button" type="submit">Apply filters</button><a class="secondary-link" th:href="@{/admin/audit}">Clear</a></form>
<div class="table-wrap"><table class="data-table"><thead><tr><th>Timestamp</th><th>Actor</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody><tr th:each="event : ${events}"><td th:text="${event.createdAt}">Date</td><td th:text="${event.actorUsername}">Actor</td><td th:text="${event.action}">ACTION</td><td th:text="${event.targetType + ' / ' + event.targetId}">Target</td><td th:text="${event.details}">Details</td></tr></tbody></table></div>
<p class="notice" th:if="${#lists.isEmpty(events)}">No audit events match these filters.</p>
</main></body></html>
