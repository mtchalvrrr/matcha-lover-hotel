<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Room Photos | [HOTEL NAME]</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="shell"><header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-mark">H</span><span th:text="${hotelSettings.hotelName}">[HOTEL NAME]</span></a><a class="back-link" th:href="@{/admin/rooms}">Back to rooms</a></header>
<section class="portal-hero compact-hero"><p class="eyebrow">ADMIN / ROOM MEDIA</p><h1 th:text="${room.name + ' photos'}">Room photos</h1><p class="intro">Upload multiple room photos, choose the cover image, or remove outdated images. Photos are stored in the application's upload directory.</p></section>
<p class="notice" th:if="${success}" th:text="${success}"></p><p class="alert alert-error" th:if="${error}" th:text="${error}"></p>
<form class="auth-card wide-form" th:action="@{/admin/rooms/{id}/photos(id=${room.id})}" method="post" enctype="multipart/form-data"><label for="photo">Room photo (JPG, PNG, WEBP; maximum 8 MB)</label><input id="photo" name="photo" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" required><button class="primary-button" type="submit">Upload photo</button></form>
<section class="room-grid"><article class="room-card" th:each="photo : ${photos}"><div class="room-image"><img th:src="${photo.publicPath}" alt="Room photo"></div><div class="room-card-body"><p class="eyebrow" th:text="${photo.cover ? 'CURRENT COVER PHOTO' : 'ROOM PHOTO'}">ROOM PHOTO</p><p th:text="${photo.originalFileName}">filename</p><div class="action-row"><form th:if="${!photo.cover}" th:action="@{/admin/rooms/{id}/photos/{photoId}/cover(id=${room.id},photoId=${photo.id})}" method="post"><button class="text-button" type="submit">Set as cover</button></form><form th:action="@{/admin/rooms/{id}/photos/{photoId}/delete(id=${room.id},photoId=${photo.id})}" method="post"><button class="text-button" type="submit">Remove</button></form></div></div></article></section>
<p class="notice" th:if="${#lists.isEmpty(photos)}">No photos uploaded for this room yet.</p>
</main></body></html>
