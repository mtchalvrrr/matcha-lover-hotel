<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Dashboard | [HOTEL NAME]</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .customer-header-actions{display:flex;align-items:center;justify-content:flex-end;gap:1rem;min-width:0}
        .customer-shortcuts{display:flex;align-items:center;flex-wrap:wrap;gap:.35rem}
        .customer-shortcuts a,.customer-shortcuts button{display:inline-flex;align-items:center;justify-content:center;padding:.65rem .8rem;border:0;border-radius:999px;background:transparent;color:var(--green,#294a35);font:inherit;font-size:.82rem;font-weight:650;text-decoration:none;white-space:nowrap;cursor:pointer}
        .customer-shortcuts a:hover,.customer-shortcuts button:hover{background:#edf2e9}
        .customer-shortcuts .current{background:#edf2e9;color:var(--green,#294a35)}
        .customer-header-actions form{flex:0 0 auto}
        @media(max-width:760px){.topbar{align-items:flex-start;flex-wrap:wrap;gap:.75rem}.customer-header-actions{width:100%;justify-content:space-between;flex-wrap:wrap}.customer-shortcuts{gap:.1rem}.customer-shortcuts a,.customer-shortcuts button{padding:.6rem .55rem;font-size:.76rem}}
        @media(max-width:430px){.customer-header-actions{align-items:flex-start}.customer-shortcuts{flex:1 1 100%;order:2}.customer-header-actions form{margin-left:auto;order:1}}
        .stay-section{margin-top:1.5rem}
        .stay-card{padding:1.25rem;border:1px solid var(--line,#d9e4dc);border-radius:18px;background:var(--surface,#fff);margin:1rem 0}
        .stay-card h2{margin:.25rem 0 .4rem}
        .stay-dates{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.8rem;margin-top:1rem}
        .stay-date{padding:1rem;border-radius:14px;background:var(--soft,#f1f6f1)}
        .stay-date span{display:block;font-size:.78rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
        .stay-date strong{display:block;margin:.45rem 0;font-size:1.08rem}
        .stay-date small{display:block}
        .stay-arrow{font-size:1.3rem;opacity:.65}
        .empty-stay{padding:1.4rem;border:1px dashed var(--line,#cbd8ce);border-radius:16px;margin-top:1rem}
        @media(max-width:560px){.stay-dates{grid-template-columns:1fr}.stay-arrow{transform:rotate(90deg);justify-self:center}}
    </style>
</head>
<body>
<main class="shell narrow">
    <div th:replace="~{fragments/customer-header :: customerHeader('dashboard')}"></div>

    <section class="stay-section" aria-labelledby="stayHeading">
        <h2 id="stayHeading">Your approved stays</h2>
        <div th:if="${!hasReservations}" class="empty-stay">
            <h3>No reservations</h3>
            <p>You don't have any reservations yet. Browse rooms to plan your stay.</p>
        </div>
        <div th:if="${hasReservations and #lists.isEmpty(approvedStays)}" class="empty-stay">
            <h3>No approved stays yet</h3>
            <p>Your reservation calendar will appear here once a reservation is approved.</p>
        </div>
        <article class="stay-card" th:each="stay : ${approvedStays}">
            <p class="eyebrow" th:text="'RESERVATION #' + ${stay.id}">RESERVATION</p>
            <h2 th:text="${stay.roomName}">Room name</h2>
            <p th:text="${stay.roomCode}">Room code</p>
            <div class="stay-dates" aria-label="Approved reservation date and time range">
                <div class="stay-date">
                    <span>Check-in</span>
                    <strong th:text="${#temporals.format(stay.checkInDate, 'EEE, MMM d, yyyy')}">Date</strong>
                    <small th:text="${#temporals.format(stay.checkInTime, 'h:mm a')}">2:00 PM</small>
                </div>
                <div class="stay-arrow" aria-hidden="true">→</div>
                <div class="stay-date">
                    <span>Check-out</span>
                    <strong th:text="${#temporals.format(stay.checkOutDate, 'EEE, MMM d, yyyy')}">Date</strong>
                    <small th:text="${#temporals.format(stay.checkOutTime, 'h:mm a')}">12:00 PM</small>
                </div>
            </div>
            <p th:text="'Status: ' + ${#strings.replace(stay.status.name(), '_', ' ')}">Status</p>
        </article>
    </section>
</main>
<div th:replace="~{fragments/chat-widget :: chatWidget}"></div>
<script th:src="@{/js/customer-dashboard.js}" defer></script>
</body>
</html>
