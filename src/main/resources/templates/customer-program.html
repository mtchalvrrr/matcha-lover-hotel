<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${hotelSettings.hotelName} + ' | Welcome'">Matcha Lover Hotel | Welcome</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="matcha-customer-home">
<main class="customer-home-shell">
    <header class="customer-home-header">
        <a class="customer-home-brand" th:href="@{/customer}" aria-label="Hotel home">
            <span class="customer-home-brand-mark">M</span>
            <span th:text="${hotelSettings.hotelName}">Matcha Lover Hotel</span>
        </a>
        <nav class="customer-home-nav" aria-label="Customer account">
            <a class="customer-home-login" th:href="@{/customer/login}">Sign in</a>
            <a class="customer-home-register" th:href="@{/register}">Sign up</a>
        </nav>
    </header>
    <section class="customer-home-main" aria-label="Explore hotel rooms">
        <div class="customer-home-main-copy">
            <p class="customer-home-kicker">WELCOME TO <span th:text="${hotelSettings.hotelName}">MATCHA LOVER HOTEL</span></p>
            <h1>Find your<br><em>kind of comfort.</em></h1>
            <a class="customer-home-explore" th:href="@{/rooms}">Explore rooms <span aria-hidden="true">↗</span></a>
        </div>
    </section>
    <footer class="customer-home-footer">
        <div class="customer-footer-brand">
            <span class="customer-footer-name" th:text="${hotelSettings.hotelName}">Matcha Lover Hotel</span>
            <span>Thoughtful stays, made comfortable.</span>
        </div>
        <div class="customer-footer-info">
            <div><span class="customer-footer-label">ADDRESS</span><span th:text="${hotelSettings.address}">Hotel address</span></div>
            <div><span class="customer-footer-label">CONTACT</span><span th:text="${hotelSettings.contactInformation}">Hotel contact information</span></div>
        </div>
    </footer>
</main>
<script>
  // Keep the customer area in this tab; browser Back returns to the customer area,
  // not to the portal-selection homepage.
  history.pushState({ customerArea: true }, "", location.href);
  window.addEventListener("popstate", function () {
    window.location.replace("/customer");
  });
</script>
<div th:replace="~{fragments/chat-widget :: chatWidget}"></div>
</body>
</html>
