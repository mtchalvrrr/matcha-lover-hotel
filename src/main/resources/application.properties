spring.application.name=hotel-reservation-system
server.port=8080
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.datasource.url=${HOTEL_DB_URL:jdbc:sqlite:./data/hotel-reservation-system.db?busy_timeout=5000}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=32MB

spring.thymeleaf.cache=false
spring.web.resources.cache.cachecontrol.no-store=true

hotel.name=${HOTEL_NAME:[HOTEL NAME]}
hotel.logo=[HOTEL LOGO]
hotel.address=[HOTEL ADDRESS]
hotel.contact=[HOTEL CONTACT INFORMATION]
hotel.public-base-url=${HOTEL_PUBLIC_BASE_URL:http://localhost:8080}
hotel.time-zone=Asia/Manila
hotel.check-in-time=${HOTEL_CHECK_IN_TIME:14:00}
hotel.check-out-time=${HOTEL_CHECK_OUT_TIME:12:00}
hotel.storage.location=${HOTEL_STORAGE_LOCATION:./data/uploads}
hotel.backup.location=${HOTEL_BACKUP_LOCATION:./data/backups}
hotel.backup.cron=${HOTEL_BACKUP_CRON:0 0 2 * * *}
hotel.reservations.pending-expiration-hours=${HOTEL_PENDING_EXPIRATION_HOURS:24}
hotel.reservations.expiry-check-ms=${HOTEL_PENDING_EXPIRY_CHECK_MS:300000}

# Configure mail credentials through environment variables; never commit secrets.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# External payment and AI integrations remain disabled until credentials are configured.
payment.mode=${PAYMENT_MODE:SIMULATED}
payment.paymongo.secret-key=${PAYMONGO_SECRET_KEY:}
payment.paymongo.webhook-secret=${PAYMONGO_WEBHOOK_SECRET:}
ai.enabled=${AI_ENABLED:true}
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# Optional Google reCAPTCHA v2 checkbox protection; enable only after setting both keys.
captcha.enabled=${CAPTCHA_ENABLED:false}
captcha.site-key=${RECAPTCHA_SITE_KEY:}
captcha.secret-key=${RECAPTCHA_SECRET_KEY:}

# Keep this key outside the database and source control. Use a random value of at least 32 bytes.
audit.hmac-key=${AUDIT_HMAC_KEY:}
payment.paymongo.reconcile-ms=${PAYMONGO_RECONCILE_MS:300000}
